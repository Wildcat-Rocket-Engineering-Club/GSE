; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino
build_flags = -D ENABLE_HWSERIAL1

lib_deps =
    # Specify libraries by name from the PlatformIO Registry (examples below)
    # Adafruit GFX Library
    # ESP32 BLE Arduino
    # You can also specify specific versions or a Git URL
    # MyPrivateLibrary@1.2.0
    # https://github.com
    # https://github.com/CuriousScientist0/ADS1256
    # Rob Rillaart's HX711 Library
    https://github.com/RobTillaart/HX711
    # ST Microelectronics' own high-speed SD library (#include <STM32SD.h>):
    stm32duino/STM32duino STM32SD@^1.4.0