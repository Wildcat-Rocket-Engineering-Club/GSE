<!DOCTYPE html>
<html>
<head>
    <title>Rocket HMI</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <style>
        body { background-color: #fff; margin: 0; }
        #stats { margin: 8px; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>

    <div id="svg_container">
        {% include 'reaLPID_v3.svg' %}
    </div>

    <div id="stats">
        <div>rate: <span id="rate">‑</span> Hz</div>
        <div>seq:&nbsp; <span id="seq">‑</span></div>
        <div>last: <span id="last">‑</span></div>
    </div>

    <script>
    var socket = io();

    // ==============================
    // DATA STATUS CIRCLE
    // Green  = data flowing (received within last 2 s)
    // Orange = stale       (2–5 s since last packet)
    // Red    = no data     (>5 s or never received)
    // ==============================
    var lastDataTime = null;
    var statusInterval = null;

    function updateStatusCircle() {
        var el = document.getElementById('dataStatusCircle');
        if (!el) return;

        var color;
        if (lastDataTime === null) {
            color = 'red';
        } else {
            var age = (Date.now() - lastDataTime) / 1000;
            if      (age < 2) color = '#00cc44';   // green — live
            else if (age < 5) color = 'orange';    // stale
            else              color = 'red';        // lost
        }
        el.setAttribute('fill', color);
    }

    // Poll the circle color every 500ms independently of packet rate
    statusInterval = setInterval(updateStatusCircle, 500);
    updateStatusCircle(); // Set initial red immediately

    // ==============================
    // CLICK-TO-COMMAND SETUP
    // ==============================
    function setupClick(id, target) {
        var el = document.getElementById(id);
        if (!el) return;
        el.style.cursor = 'pointer';
        el.dataset.state = '0';
        el.addEventListener('click', function () {
            var newState = el.dataset.state === '1' ? 0 : 1;
            el.dataset.state = newState.toString();
            console.log('Click: ' + id + ' → ' + target + ' = ' + newState);
            socket.emit('command', { cmd: 'set_valve', target: target, state: newState });
        });
    }

    window.addEventListener('load', function () {
        setupClick('GSE_x5F_DumpValve',     'gse_dump');
        setupClick('GSE_x5F_ReliefValve',   'gse_relief');
        setupClick('GSE_x5F_FillValve',     'gse_fill');
        setupClick('RKT_x5F_MainFuelValve', 'rocket_fuel');
        setupClick('RKT_x5F_MainOxValve',   'rocket_ox');
        setupClick('RKT_x5F_ReliefValve',   'rocket_relief');
        setupClick('RKT_x5F_DumpValve',     'rocket_dump');
        setupClick('RKT_x5F_IGN',           'ignite');
    });

    // ==============================
    // RATE / SEQUENCE DISPLAY
    // ==============================
    var lastTs  = null;
    var avgHz   = null;
    var SMOOTH  = 0.15;

    // ==============================
    // HELPERS
    // ==============================

    // Valve indicator: 0 = closed (red), 1 = open (green)
    function setValveColor(id, state) {
        var el = document.getElementById(id);
        if (el) el.setAttribute('fill', state === 1 ? '#00cc44' : 'red');
    }

    // Pressure indicator: green / orange / red by threshold
    function setPressureColor(id, psi) {
        var el = document.getElementById(id);
        if (!el) return;
        var color = psi < 650 ? '#00cc44' : (psi <= 830 ? 'orange' : 'red');
        el.setAttribute('fill', color);
    }

    // Update text inside a group (handles tspan nesting from Inkscape SVGs)
    function setText(id, value) {
        var el = document.getElementById(id);
        if (!el) return;
        var t = el.querySelector('text') || el.querySelector('tspan');
        if (t) t.textContent = value;
        else   el.textContent = value;
    }

    // Keep click-toggle in sync with real reported state
    function syncClickState(id, state) {
        var el = document.getElementById(id);
        if (el) el.dataset.state = state.toString();
    }

    // ==============================
    // TELEMETRY HANDLER
    // ==============================
    socket.on('telemetry', function (data) {

        lastDataTime = Date.now();      // feed the status circle watchdog
        updateStatusCircle();

        // Rate display
        var now = Date.now() / 1000;
        if (lastTs !== null) {
            var dt = now - lastTs;
            var hz = dt > 0 ? 1 / dt : 0;
            avgHz  = avgHz === null ? hz : (SMOOTH * hz + (1 - SMOOTH) * avgHz);
            document.getElementById('rate').textContent = avgHz.toFixed(1);
        }
        lastTs = now;

        if (data.seq !== undefined)
            document.getElementById('seq').textContent = data.seq;

        document.getElementById('last').textContent =
            data.ts ? new Date(data.ts * 1000).toLocaleTimeString()
                    : new Date().toLocaleTimeString();

        var en  = data.enables || {};
        var pt  = data.pressure_transducers || {};
        var gse = data.gse || {};
        var rkt = data.rocket || {};

        // --- Pressures ---
        if (en.bottle_pressure && pt.bottle_pressure !== undefined) {
            setText('pressure1', pt.bottle_pressure + ' PSI');
            setPressureColor('BottleCircle', pt.bottle_pressure);
        }
        if (en.tank_pressure && pt.tank_pressure !== undefined) {
            setText('pressure2', pt.tank_pressure + ' PSI');
            setPressureColor('tankCircle', pt.tank_pressure);
        }
        if (en.chamber_pressure && pt.chamber_pressure !== undefined) {
            setText('pressure3', pt.chamber_pressure + ' PSI');
            setPressureColor('EngineCircle', pt.chamber_pressure);
        }

        // --- GSE ---
        if (en.loadcell && gse.loadcell !== undefined)
            setText('loadcell', gse.loadcell.toFixed(2) + ' kg');

        if (en.gse_fill    && gse.fill    !== undefined) setValveColor('gse_x5F_fill_x5F_state',    gse.fill);
        if (en.gse_dump    && gse.dump    !== undefined) setValveColor('gse_x5F_dump_x5F_state',    gse.dump);
        if (en.gse_relief  && gse.relief  !== undefined) setValveColor('gse_x5F_relief_x5F_valve',  gse.relief);

        // --- Rocket ---
        if (en.rocket_ox     && rkt.ox     !== undefined) setValveColor('rocket_x5F_ox_x5F_state',     rkt.ox);
        if (en.rocket_fuel   && rkt.fuel   !== undefined) setValveColor('rocket_x5F_fuel_x5F_state',   rkt.fuel);
        if (en.rocket_relief && rkt.relief !== undefined) setValveColor('rocket_x5F_relief_x5F_state', rkt.relief);
        if (en.rocket_dump   && rkt.dump   !== undefined) setValveColor('rocket_x5F_dump_x5F_state',   rkt.dump);
        if (rkt.ign !== undefined) setValveColor('ign_x5F_state', rkt.ign);

        // --- Sync click-toggle state with reported hardware state ---
        syncClickState('GSE_x5F_FillValve',     gse.fill);
        syncClickState('GSE_x5F_DumpValve',      gse.dump);
        syncClickState('GSE_x5F_ReliefValve',    gse.relief);
        syncClickState('RKT_x5F_MainOxValve',    rkt.ox);
        syncClickState('RKT_x5F_MainFuelValve',  rkt.fuel);
        syncClickState('RKT_x5F_ReliefValve',    rkt.relief);
        syncClickState('RKT_x5F_DumpValve',      rkt.dump);
    });
    </script>

</body>
</html>
